name: ParseCore Bot contributors

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  contributors:
    name: Refresh contributors
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify the logic
        run: uv run --script .github/parsecore-bot/contributors.py --self-test

      - name: Refresh the contributors list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: uv run --script .github/parsecore-bot/contributors.py
