name: ParseCore Bot Release PR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Propose release
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify the logic
        run: uv run --script .github/parsecore-bot/release_pr.py --self-test

      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: uv run --script .github/parsecore-bot/release_pr.py
