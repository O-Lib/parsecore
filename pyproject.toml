[project]
name = "parsecore"
version = "2.0.0"
description = "A Python library for osu! beatmaps: parsing, mods, star rating and performance points."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Error44", email = "error44@olib.dev" },
    { name = "DevilPedrow", email = "devilpedrow@olib.dev" },
]
requires-python = ">=3.11"
keywords = ["osu", "beatmap", "parser", "mods", "difficulty", "performance", "pp", "star-rating"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/O-Lib/parsecore"
Repository = "https://github.com/O-Lib/parsecore"
Documentation = "https://parsecore.readthedocs.io"
Issues = "https://github.com/O-Lib/parsecore/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PYI"]
ignore = [
    "E501",
    "PYI034",
    "B904",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=parsecore --cov-report=term-missing"

[tool.coverage.run]
source = ["parsecore"]
omit = ["tests/*"]
